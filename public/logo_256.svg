<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <!-- 新增：背景质感优化（渐变边框+内阴影，沿用第二次设计的精致感） -->
  <defs>
    <!-- 主色渐变：从深紫到浅紫，贴合主站风格且不刺眼 -->
    <linearGradient id="bgBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- 内阴影：让背景有轻微“凸起感”，避免扁平 -->
    <filter id="innerShadowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.05)" flood-opacity="1" />
    </filter>
  </defs>

  <rect 
    x="24" 
    y="24" 
    width="208" 
    height="208" 
    rx="48" 
    ry="48" 
    stroke="url(#bgBorderGradient)" 
    stroke-width="8" 
    fill="white" 
    filter="url(#innerShadowEffect)" 
  />
  
  <!-- 核心：完全保留你偏好的中部表单设计，无任何修改 -->
  <rect x="68" y="84" width="120" height="64" rx="4" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="100" width="96" height="16" rx="2" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <rect x="80" y="124" width="48" height="16" rx="2" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <rect x="136" y="124" width="40" height="16" rx="2" fill="#7c3aed" stroke="#7c3aed" stroke-width="4"/>
  
  <!-- 拖拽符号：完全保留原设计 -->
  <path d="M192 128L216 128" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M216 128L208 120M216 128L208 136" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 128L40 128" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4"/>
  <path d="M40 128L48 120M40 128L48 136" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Vue 风格点缀：完全保留原设计 -->
  <path d="M184 184L208 184L208 160" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>